# Sunshine Terminal pre-release CI — Node tests + Android debug APK.
# Master pushes also update the rolling `latest-debug` prerelease on the
# Release page (stable `v*` tags still use release.yml).
# Signed release is out of scope (needs keystore secrets — later phase).

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: .
      # Guest vsock agent framing selftest — golden vectors shared with
      # VsockWireTest (host/guest stay in lockstep by construction).
      - run: python3 guest/sunshine-vsock-agent.py --selftest
        working-directory: .

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sunshine-terminal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # Rolling prerelease: every master push refreshes the `latest-debug`
      # release so the APK is always on the Release page without manual tags.
      # PRs are skipped (push-to-master only).
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          tag_name: latest-debug
          name: Latest Debug Build
          prerelease: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
