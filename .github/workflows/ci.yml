# Sunshine Terminal pre-release CI — Node tests + Android debug APK.
# No versioning: versionCode/versionName stay fixed until release flow lands.
# Signed release is out of scope (needs keystore secrets — later phase).

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: .

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sunshine-terminal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
